server:
  port: 8083
  servlet:
    context-path: /day3

spring:
  application:
    name: order-alert-module
  
  # 开发工具配置
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# 日志配置
logging:
  level:
    com.picc.java.learn.alert: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 订单预警配置
club:
  alert:
    # 省份代码
    province: 44000000
    # 阈值配置
    thresholds: 10
    # 时间窗口配置（小时）
    time-window: 12
    # 渠道配置（多个渠道用逗号分隔）
    source: 14,28,39
    # 预警管理员配置
    managers:
      # 第36个管理员组
      - id: 36
        # 接收人配置（3个人）
        receiver:
          - phone: "18622201499"
            name: "张丽"
            eBanUserId: "12438032-VvhmMFJzjW8jtWyvm0mHomXxqugMo6Bw"
          - phone: "18622201500"
            name: "李强"
            eBanUserId: "12438032-ABC123DEF456GHI789"
          - phone: "18622201501"
            name: "王芳"
            eBanUserId: "12438032-XYZ789ABC123DEF456"
    
    # 预警免打扰机制配置
    quiet-mode:
      # 免打扰时间段（分钟）：第一次预警后，下次预警时间间隔依次为10分钟、30分钟、60分钟
      quiet-periods: [10, 30, 60]
      # 最大预警次数：超过此次数后，使用最后一个免打扰时间段（60分钟）作为预警频率
      max-alert-count: 3
      # 是否启用免打扰机制
      enabled: true
      # Redis key前缀
      redis-key-prefix: "quiet_mode"
      # 预警记录过期时间（分钟）
      expire-minutes: 60
      # 是否启用调试日志
      debug-enabled: true

    # 风险管控配置
    risk-control:
      # 是否启用风险管控
      enabled: true
      # 权重阈值配置
      weight:
        # 阻断阈值（超过此值将阻断渠道）
        block-threshold: 60
        # 高风险阈值
        high-risk-threshold: 40
        # 中风险阈值
        medium-risk-threshold: 20
        # 低风险阈值
        low-risk-threshold: 10
      
      # 身份证修改风险配置
      id-card-modify:
        # 当天超过此次数开始累加权重
        daily-threshold: 3
        # 超过阈值后每次累加权重
        weight-increment: 10
        # 首次超过阈值累加权重
        first-exceed-weight: 30
      
      # 手机号修改风险配置
      phone-modify:
        # 当天超过此次数开始累加权重
        daily-threshold: 3
        # 超过阈值后每次累加权重
        weight-increment: 10
        # 首次超过阈值累加权重
        first-exceed-weight: 30
      
      # 注销重注册风险配置
      re-register:
        # 当天超过此次数开始累加权重
        daily-threshold: 2
        # 超过阈值后每次累加权重
        weight-increment: 10
        # 首次超过阈值累加权重
        first-exceed-weight: 30
      
      # 同手机号注册风险配置
      same-phone-register:
        # 当天超过此次数开始累加权重
        daily-threshold: 3
        # 超过阈值后每次累加权重
        weight-increment: 10
        # 首次超过阈值累加权重
        first-exceed-weight: 10
      
      # 特殊产品风险配置
      special-product:
        # 每次订单累加权重
        weight-per-order: 2
        # 特殊产品关键词列表
        keywords: ["红包", "停车券", "代金券", "话费", "肯德基", "麦当劳", "奈雪", "喜茶", "霸王茶姬"]
      
      # 无有效保单风险配置
      no-policy:
        # 每次累加权重
        weight-per-incident: 5
      
      # 连续预警阻断配置
      continuous-alert:
        # 连续预警超过此次数将阻断渠道
        block-threshold: 3
      
      # 订单数量阻断配置
      order-count:
        # 预警订单数量超过此值将阻断渠道
        block-threshold: 50
        # 统计时间窗口（小时）
        time-window: 12
      
      # 连续天数阻断配置
      continuous-days:
        # 连续统计天数
        total-days: 5
        # 有预警的天数阈值
        alert-days-threshold: 3
      
      # 阻断管理配置
      block-management:
        # 是否启用阻断功能
        enabled: true
        # 阻断解除权限角色（管理岗位）
        unblock-roles: ["ADMIN", "MANAGER", "SUPERVISOR"]
        # 是否记录解除轨迹
        log-unblock-trail: true
